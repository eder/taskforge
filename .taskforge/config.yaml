# TaskForge System Configuration (Self-Hosting Optimized)
# Documentation: https://github.com/eder/taskforge#configuration

# 1. Router Configuration (OpenAI Structured Outputs or Heuristic Fallback)
router:
  provider: openai # 'openai' or 'static'
  model: gpt-4o-mini # Model name (e.g. gpt-4o-mini, gpt-4o)
  escalationModel: gpt-4o # Escalation model for high uncertainty tasks
  fallback: static # Resilient fallback if OpenAI is unavailable
  adaptive: false # Enable historical performance-based adaptive routing

# 2. Execution Settings
execution:
  profile: economy # 'economy' (1 agent/task, 1M cap) | 'standard' (2, 2M) | 'thorough' (3, 4M)
  maxParallelTasks: 3
  defaultTimeoutMinutes: 30
  worktreesDir: .taskforge/worktrees
  databasePath: .taskforge/taskforge.db
  runsDir: .taskforge/runs
  autoPruneOlderThan: 7d # Clean up stale worktrees and temporary branches older than 7 days

# 3. Git Workflow & Delivery
git:
  workflow: github-flow # Always target PRs against main for clean dogfooding

# 4. Collaboration & Communication Bus Limits
collaboration:
  # maxAgentsPerTask is governed by execution.profile above (set explicitly to override)
  maxMessagesPerRound: 6
  maxRounds: 3
  reviewFixPasses: 1

# 5. Deterministic Security & Permission Policy
permissions:
  filesystem:
    workspace_write: allow
    outside_workspace: ask_human
    delete_files: ask_human
  commands:
    tests: allow
    lint: allow
    package_install: ask_human
    network: ask_human
    sudo: deny
  git:
    commit: allow
    push: ask_human
    force_push: deny
    merge_main: deny
  fallback: ask_human

# 6. Headless Automation Policy
headless:
  onHumanQuestion: block
  onUnknownPermission: deny
  onAuthenticationRequired: fail
  onConfirmationRequired: block

# 7. Interaction Gateway & Human Timeouts
interactions:
  humanResponseTimeout: 1800000 # 30 minutes in milliseconds
  onTimeout:
    permission: deny
    question: block
    confirmation: block

# 8. Quality Gates & Fast Package-Scoped Verification
verification:
  tests: true
  lint: true
  typecheck: true
  review: true
  maxReworkCycles: 2
  commands: []
  # Fast package-scoped checks (~5s per package instead of ~60s full monorepo suite)
  scopedCommands:
    - scope: packages/conversation/**
      commands:
        - pnpm --filter @taskforge/conversation build && pnpm vitest run packages/conversation/tests && pnpm lint
    - scope: packages/scheduler/**
      commands:
        - pnpm --filter @taskforge/scheduler build && pnpm vitest run packages/scheduler/tests && pnpm lint
    - scope: packages/agents/**
      commands:
        - pnpm --filter @taskforge/agents build && pnpm vitest run packages/agents/tests && pnpm lint
    - scope: packages/workspace/**
      commands:
        - pnpm --filter @taskforge/workspace build && pnpm vitest run packages/workspace/tests && pnpm lint
    - scope: packages/collaboration/**
      commands:
        - pnpm --filter @taskforge/collaboration build && pnpm vitest run packages/collaboration/tests && pnpm lint
    - scope: packages/verification/**
      commands:
        - pnpm --filter @taskforge/verification build && pnpm vitest run packages/verification/tests && pnpm lint
    - scope: packages/integration/**
      commands:
        - pnpm --filter @taskforge/integration build && pnpm vitest run packages/integration/tests && pnpm lint
    - scope: packages/planner/**
      commands:
        - pnpm --filter @taskforge/planner build && pnpm vitest run packages/planner/tests && pnpm lint
    - scope: packages/router/**
      commands:
        - pnpm --filter @taskforge/router build && pnpm vitest run packages/router/tests && pnpm lint
    - scope: packages/persistence/**
      commands:
        - pnpm --filter @taskforge/persistence build && pnpm vitest run packages/persistence/tests && pnpm lint
    - scope: packages/shared/**
      commands:
        - pnpm build && pnpm vitest run packages/shared/tests && pnpm lint
    - scope: apps/cli/**
      commands:
        - pnpm build && pnpm vitest run tests/ && pnpm lint

# 9. Optional Desktop Notifications (enable locally or in ~/.taskforge/config.yaml)
notifications:
  enabled: false
  sound: false
