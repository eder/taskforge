name: Release

# Publishing is deliberately manual-trigger or tag-driven:
#   1. node scripts/set-version.mjs X.Y.Z   (updates every package, lockstep)
#   2. update CHANGELOG.md, commit, merge to main
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
# A manual run (workflow_dispatch) always defaults to a dry run.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify only; do not publish'
        type: boolean
        default: true

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Verify release metadata (versions, license, files, tag)
        run: node scripts/verify-release.mjs ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Dry-run publish (packs every package, publishes nothing)
        run: pnpm -r publish --dry-run --no-git-checks --access public --tag beta

      # 0.x and prerelease versions are published under the `beta` tag so that a plain
      # `npm install` never picks up an experimental release; stable versions use `latest`.
      - name: Choose npm dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          case "$VERSION" in 0.*|*-*) TAG=beta ;; *) TAG=latest ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with npm tag: $TAG"

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry-run != true
        run: pnpm -r publish --no-git-checks --access public --provenance --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry-run != true
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
